name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Verify catalog is current
        run: |
          Rscript data-raw/build_catalog.R
          if ! git diff --quiet -- inst/catalog/functions.json; then
            # Ignore the volatile "generated" timestamp; fail on real drift
            git diff -U0 -- inst/catalog/functions.json | grep '^[+-]' \
              | grep -vE '^(\+\+\+|---)' | grep -v '"generated"' > drift.txt || true
            if [ -s drift.txt ]; then
              echo "Catalog is out of date with the installed rpact:"
              cat drift.txt
              exit 1
            fi
          fi
          git checkout -- inst/catalog/functions.json

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'
